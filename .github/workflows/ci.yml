name: CI
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yaki
          POSTGRES_PASSWORD: yaki
          POSTGRES_DB: yaki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yaki" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://yaki:yaki@localhost:5432/yaki
      TEST_DATABASE_URL: postgresql://yaki:yaki@localhost:5432/yaki_test
      APP_SECRET: ci-only-secret-0123456789abcdef0123456789
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: PGPASSWORD=yaki psql -h localhost -U yaki -d yaki -c "CREATE DATABASE yaki_test"
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
