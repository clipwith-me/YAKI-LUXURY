# Netlify deploys from the Git repository (not drag-and-drop): this is a full-stack Next.js app
# that needs a PostgreSQL database and server functions. Netlify's Next.js runtime is detected
# automatically. Set DATABASE_URL, APP_SECRET, CRON_SECRET and NEXT_PUBLIC_SITE_URL in
# Site configuration → Environment variables before the first deploy.
[build]
  command = "npx prisma migrate deploy && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
